name: Bug report
description: Report a reproducible Cordis Social problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, cookies, credentials, private drafts, or browser profiles.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: cordis-plugin-social-x@0.1.0
    validations:
      required: true
  - type: input
    id: cordis
    attributes:
      label: Cordis version
      placeholder: 4.0.0-rc.9
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and redacted logs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
